<div class="pd" id="pd">${[0,1,2,3].map(i=>`<i class="${i<ui.pin.length?'f':''}"></i>`).join('')}</div><div class="keys">${['1','2 ABC','3 DEF','4 GHI','5 JKL','6 MNO','7 PQRS','8 TUV','9 WXYZ'].map(k=>`<a data-a="key" data-v="${k[0]}">${k[0]}<small>${k.slice(2)}</small></a>`).join('')}<span></span><a data-a="key" data-v="0">0<small>+</small></a><a data-a="back" style="font-size:20px">✕</a></div><b data-a="toast" data-v="Код по умолчанию: 1234" style="margin-top:20px;font-size:18px;min-height:44px">Забыли код?</b></div></div>`}
function bank(){let lim=S.trust*8000;return`<div class="sc bank"><div class="hd" style="background:#f4f5f7;color:#111"><b data-a="back" style="color:#ff7a00">←</b>П-Банк</div><div class="bd"><div class="cardb"><div style="font-size:24px;font-weight:700">П-Банк</div><div><span style="opacity:.8">Баланс</span><br><big>${F(S.cash).replace('\u00a0₽',',00 ₽')}</big></div><div style="display:flex;justify-content:space-between;align-items:end"><div style="display:flex;gap:14px;align-items:center"><div class="chp"></div>•••• 5232</div><div style="text-align:right;font-size:13px">ДЕБЕТОВАЯ<br><b style="font-size:19px">ИГРОК</b></div></div></div>
<div class="tl"><div data-a="loan"><span>🏛</span><b>Кредиты</b><span>${S.debt?'Долг '+F(S.debt):'Нет долгов'}</span></div><div data-a="toast" data-v="Лимит кредита растёт с доверием: ${lim.toLocaleString('ru')} ₽"><span>🔒</span><b>Доверие</b><span>${S.trust} из 100</span></div></div>
<div class="wb" data-a="mom" style="margin-bottom:12px"><span>💝</span><b>Перевести родным</b><span>Маме, бабушке, другу — просто так</span></div>
<div class="wb"><b style="font-size:26px;margin:0 0 6px">История</b>${S.hist.map(h=>`<div class="hr"><div><b>${h.t}</b><span>День ${h.d}</span></div><b style="color:${h.a>0?'#15803d':'#111'}">${h.a>0?'+':''}${F(h.a)}</b></div>`).join('')}</div></div></div>`}
function vault(){let l=S.as,tot=l.reduce((s,a)=>s+val(a),0),cost=l.reduce((s,a)=>s+(a.cost||0),0),t=ui.vt,it=l.filter(a=>a.ty==t),i=CL(ui.vi,0,Math.max(0,it.length-1)),a=it[i];
return`<div class="sc"><div class="hd"><b data-a="back">←</b>Хранилище</div><div class="bd" style="background:#f4f5f7"><div class="wb" style="display:flex;justify-content:space-between"><div><span>Стоимость по оценке</span><b style="font-size:30px;margin:4px 0">${F(tot)}</b><b style="color:#15803d;font-size:18px">${tot-cost>=0?'+':''}${F(tot-cost)}</b></div><div style="text-align:right"><span>Активов <b style="display:inline">${l.length}</b></span><br><span>В продаже <b style="display:inline">${l.filter(x=>x.l).length}</b></span><br><span>Рынок <b style="display:inline;font-size:15px">${Object.keys(TY).map(k=>TY[k].i+(S.mk[k]>=1?'↑':'↓')).join(' ')}</b></span></div></div>
<div class="tabs">${Object.keys(TY).map(k=>`<a data-a="vt" data-v="${k}" class="${t==k?'on':''}">${TY[k].n}</a>`).join('')}</div>
<div class="gar">${a?vis(a):'<div class="nm" style="bottom:130px">Здесь пока пусто</div>'}<div class="nm">${it.length?(i+1)+' из '+it.length:''}</div>${it.length>1?`<b data-a="vi" data-v="-1" style="position:absolute;left:8px;color:#fff;font-size:34px;min-width:44px;min-height:44px">‹</b><b data-a="vi" data-v="1" style="position:absolute;right:8px;color:#fff;font-size:34px;min-width:44px;min-height:44px">›</b>`:''}</div>
${a?`<div class="ac dk" style="margin-top:12px">${acard(a)}<button class="bt ob" data-a="open" data-v="${t}">Открыть «${TY[t].n}»</button></div>`:''}</div></div>`}
function acard(a){let r=rr(an(a).s);return`<div class="row"><span class="rc" style="color:${RC[r]}">${RN[r]}</span><span class="val">≈ ${F(val(a))}</span></div>${rb(r)}<div class="tx">${a.l?'В продаже за '+F(a.l):'На хранении'}${a.car?' · на машине':''} · куплен за ${F(a.cost||0)}</div><div class="tx">${an(a).t.join(' · ')||'Без особенностей'}</div><div style="margin-top:6px">${spark(a)}</div>`}
function docs(){let M={'Фамилия':'Иванов','Имя':'Иван','Отчество':'Иванович'};return`<div class="sc"><div class="hd" style="background:#7b2cbf"><b data-a="back">←</b>Госбай</div><div class="bd" style="background:#f0f2f8"><div class="pass"><h5>РОССИЙСКАЯ ФЕДЕРАЦИЯ · ПАСПОРТ</h5><div style="display:flex;gap:14px"><div style="width:90px;height:110px;background:#e6ecf5;border-radius:10px;font-size:56px;display:flex;align-items:center;justify-content:center">🧑</div><div>${Object.keys(M).map(k=>`<small>${k}</small><b>${M[k]}</b>`).join('')}</div></div><small>Дата рождения</small><b>20.10.2000 · МУЖ.</b><small>Место рождения</small><b>ГОР. ЕКАТЕРИНБУРГ</b></div>
<div class="pass l"><h5 style="color:#223">ВОДИТЕЛЬСКОЕ УДОСТОВЕРЕНИЕ · DRIVING LICENCE</h5><small>3. Дата рождения</small><b>20.10.2000</b><small>5. Номер</small><b>87 04 000979</b><small>9. Категории</small><b>B, B1, M</b></div>
<h3>Сертификаты ваших активов</h3>${S.as.map(a=>`<div class="li"><span style="font-size:32px">📄</span><div><b>${a.name.slice(0,26)}</b><span>№ ${(a.id*7919+100000).toString(16).toUpperCase()} · ${TY[a.ty].n}</span></div></div>`).join('')||'<p style="color:#777">Активов пока нет</p>'}</div></div>`}
function tasks(){const T=[['Купить 2 актива',S.q.b,2],['Прокрутить 3 раза',S.q.sp,3],['Продать актив',S.q.s,1],['Заработать 20 000 ₽',S.q.p,20000]];
return`<div class="sc"><div class="hd" style="background:#ff8f1f"><b data-a="back">←</b>Задания дня</div><div class="bd">${T.map((t,i)=>`<div class="li"><div><b>${t[0]}</b><span>${Math.min(t[1],t[2]).toLocaleString('ru')} / ${t[2].toLocaleString('ru')} · награда 5 000 ₽</span></div>${S.q.r[i]?'<span>✓</span>':`<button class="bt ${t[1]>=t[2]?'b3':'b4'}" data-a="claim" data-i="${i}" ${t[1]>=t[2]?'':'disabled style="opacity:.4"'}>Забрать</button>`}</div>`).join('')}</div></div>`}
function sleep(){return`<div class="sc"><div class="hd" style="background:#4a5a9a"><b data-a="back">←</b>Сон</div><div class="bd"><p style="font-size:18px">Время идёт: покупатели пишут, цены меняются, витрина обновляется.</p><div style="display:grid;gap:10px"><button class="b1" data-a="sl" data-v="60">Пропустить 1 час</button><button class="b1" data-a="sl" data-v="480">Спать 8 часов</button><button class="b1" data-a="sl" data-v="${1440-S.t%1440+480}">Спать до утра</button></div></div></div>`}
function appv(ty){let T=TY[ty],n=S.as.filter(a=>a.ty==ty),h=`<div class="sc dk" style="--ac:${T.c}"><div class="dh"><b data-a="back">←</b>${T.n}</div><div class="wl"><span>💳 ${F(S.cash)}</span><small>На хранении ${n.length}/20</small></div><div class="tb">${[['vit','Витрина'],['spin',T.sp],['mine','Мои'],['chk','Проверка']].map(t=>`<a data-a="at" data-v="${t[0]}" class="${ui.at==t[0]?'on':''}">${t[1]}</a>`).join('')}</div><div class="bd">`;
if(ui.at=='vit'){h+=`<div class="inf">Витрина обновляется раз в игровой день. До обновления: ${Math.ceil((1440-S.t%1440)/60)} ч.</div>`;h+=S.vit.filter(v=>v.a.ty==ty).map(v=>`<div class="ac"><div class="vs">${vis(v.a)}</div><div class="row"><span class="rc" style="color:${RC[rr(an(v.a).s)]}">${RN[rr(an(v.a).s)]}</span><span class="val">≈ ${F(val(v.a))}</span></div><div class="tx">${an(v.a).t.join(' · ')}</div><button class="bt yb" data-a="buy" data-i="${v.id}">Купить за ${F(v.pr)}</button></div>`).join('')||'<div class="inf">Сегодня таких лотов нет. Загляните завтра или поспите.</div>'}
if(ui.at=='spin'){let r=ui.res[ty];h+=`<div class="inf">${T.sd}</div><button class="tg" data-a="fast">Быстро: ${ui.fast?'вкл':'выкл'}</button><div class="rs">${r=='…'?'<div style="color:#fff;font-size:22px">Крутим…</div>':r?vis(r)+`<span class="rc" style="color:${RC[rr(an(r).s)]}">${RN[rr(an(r).s)]}</span><span class="val" style="color:#fff">≈ ${F(val(r))}</span><span class="tx">${an(r).t.join(' · ')||'Без особенностей'}</span>${r.taken?'':'<button class="bt b4" style="color:#111" data-a="take">Забрать на хранение</button>'}`:'Нажмите «Крутить»'}</div>
<button class="yb" data-a="spin">${ui.busy?'Крутим…':'Крутить за '+F(T.cost)}</button><button class="ob" data-a="auto">${ui.auto?'Остановить автокрутку':'Автокрутка'}</button>`}
if(ui.at=='mine')h+=n.map(a=>`<div class="ac"><div class="vs">${vis(a)}</div>${acard(a)}<div class="btn2">${a.l?`<button class="bt ob" data-a="unlist" data-i="${a.id}">Снять с продажи</button>`:`<button class="bt yb" data-a="list" data-i="${a.id}">Продать</button>`}<button class="bt ob" data-a="dump" data-i="${a.id}">Сдать за ${F(val(a)*.6)}</button>${ty=='plate'&&!a.car?`<button class="bt ob" style="grid-column:1/3" data-a="car" data-i="${a.id}">Повесить на машину</button>`:''}</div></div>`).join('')||'<div class="inf">Здесь пусто. Купите на витрине или крутите.</div>';
if(ui.at=='chk'){let r=ui.ckr;h+=`<div class="inf">Введите ${{plate:'номер, например А777АА 77',phone:'номер, например +7 999 777-77-77',user:'юзернейм, например @king',gift:'тираж подарка, например 80'}[ty]}</div><input class="ck" id="ck" value="${ui.ck}" placeholder="Введите значение"><button class="yb" data-a="chk">Оценить</button>${r===0?'<div class="inf" style="margin-top:12px">Не удалось разобрать. Проверьте формат.</div>':r?`<div class="ac" style="margin-top:12px"><div class="row"><span class="rc" style="color:${RC[rr(r.s)]}">${RN[rr(r.s)]}</span><span class="val">≈ ${F(vv(ty,r.s))}</span></div>${rb(rr(r.s))}<div class="tx">${r.t.join(' · ')||'Без особенностей'}</div></div>`:''}<h3 style="margin:18px 0 0">Что ценится</h3><ul class="ul">${RULES[ty].map(x=>`<li>${x}</li>`).join('')}</ul>`}
return h+'</div></div>'}
function priceSheet(kind,id,def,sub){let a=kind=='list'?S.as.find(x=>x.id==id):0;ui.sh={kind,id};let st=500;sheet(`<h3>🏷 ${kind=='list'?'Выставить на продажу':'Торговаться (Цена)'}</h3><p>${sub}</p><b>Ваша цена (₽)</b><div class="pr"><button data-a="pm" data-v="-1">−</button><input id="pv" inputmode="numeric" value="${def}" data-st="${st}"><button data-a="pm" data-v="1">+</button></div><button class="b1" data-a="pok">${kind=='list'?'Опубликовать':'Предложить'}</button>`)}
function act(a,d){let n=nav[nav.length-1];ui.force=1;
switch(a){
case'open':{let v=d.v;if(TY[v]){ui.at='vit';nav.push({s:'app',ty:v})}else if(v=='ads'){ui.tab='ads';nav.push({s:'ads'})}else{if(v=='vault')ui.vt='plate';nav.push({s:v})}break}
case'back':nav.length>1&&nav.pop();break;case'msgs':ui.tab='msg';nav.push({s:'ads'});break;case'toast':toast(d.v);break;
case'tab':ui.tab=d.v;break;case'pt':ui.pt=d.v;break;case'at':ui.at=d.v;ui.ckr=null;break;case'vt':ui.vt=d.v;ui.vi=0;break;case'vi':ui.vi+=+d.v;break;
case'sort':ui.sort=(ui.sort+1)%3;toast(['Без сортировки','Сначала дешёвые','Сначала дорогие'][ui.sort]);break;
case'flt':{let k=['',...Object.keys(TY)];ui.flt=k[(k.indexOf(ui.flt)+1)%k.length];toast(ui.flt?'Только: '+TY[ui.flt].n:'Все категории');break}
case'fav':{let i=+d.i;S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];break}
case'buy':buy(+d.i);break;case'fast':ui.fast=!ui.fast;break;
case'spin':spin(n.ty);ui.force=0;return;
case'auto':ui.auto=!ui.auto;if(ui.auto)spin(n.ty);break;
case'take':{let r=ui.res[n.ty];if(r&&!r.taken){if(S.as.filter(x=>x.ty==n.ty).length>=20)toast('Хранилище заполнено (20/20)');else{r.taken=1;S.as.push(r);toast('Забрано на хранение')}}break}
case'chk':{ui.ck=$('#ck').value;let v=ui.ck.trim(),r=n.ty=='plate'?anPlate(v):n.ty=='phone'?anPhone(v):n.ty=='user'?anUser(v):(+v>0?anGift({tir:+v,bg:0,pt:0}):null);ui.ckr=r||0;break}
case'dump':{let x=S.as.find(q=>q.id==+d.i);if(x){S.cash+=Math.round(val(x)*.6);S.as=S.as.filter(q=>q!==x);S.ch.forEach(c=>{if(c.aid==x.id)c.x=1});hist('Сдача: '+x.name,Math.round(val(x)*.6));toast('Сдано государству за 60% оценки')}break}
case'car':{let x=S.as.find(q=>q.id==+d.i);x.car=1;toast('Номер на машине: оценка +10%');break}
case'unlist':{let x=S.as.find(q=>q.id==+d.i);x.l=0;S.ch.forEach(c=>{if(c.aid==x.id)c.x=1});toast('Снято с продажи');break}
case'boost':{let x=S.as.find(q=>q.id==+d.i);if(S.cash<3000)toast('Не хватает денег');else{S.cash-=3000;x.bt=S.t+1440;hist('Продвижение: '+x.name,-3000);toast('Объявление продвигается 24 часа')}break}
case'post':{let l=S.as.filter(x=>!x.l);sheet(`<h3>Что продаём?</h3><p>Выберите актив из хранилища</p>${l.map(x=>`<div class="li" style="background:#f4f5f7" data-a="list" data-i="${x.id}"><div><b>${x.name.slice(0,24)}</b><span>≈ ${F(val(x))}</span></div></div>`).join('')||'<p>Нет свободных активов. Купите на витрине.</p>'}`);ui.force=0;return}
case'list':{let x=S.as.find(q=>q.id==+d.i);priceSheet('list',x.id,Math.round(val(x)*1.15/500)*500,'Оценка ≈ '+F(val(x))+'. Чем ближе цена к оценке, тем больше покупателей.');ui.force=0;return}
case'pm':{let i=$('#pv'),s=+i.dataset.st;i.value=Math.max(500,(+i.value||0)+s*d.v);ui.force=0;return}
case'pok':{let p=Math.round(+$('#pv').value),s=ui.sh;if(!p||p<500)return toast('Введите цену');sheet();
if(s.kind=='list'){let x=S.as.find(q=>q.id==s.id);x.l=p;toast('Объявление опубликовано');if(n.s=='ads'&&ui.tab=='ads'){ui.tab='me';ui.pt='a'}}else{let c=S.ch.find(q=>q.id==s.id);bargain(c,p)}break}
case'chat':{let c=S.ch.find(q=>q.id==+d.i);c.u=0;nav.push({s:'chat',id:c.id});break}
case'deny':{let c=S.ch.find(q=>q.id==+d.i);say(c,'me','Спасибо, не подходит.');c.x=1;if(c.sc){S.trust=Math.min(100,S.trust+1);toast('Верно: предоплату просят мошенники')}break}
case'agree':{let c=S.ch.find(q=>q.id==+d.i);say(c,'me','Согласен, '+F(c.o)+'.');deal(c,c.o);break}
case'barg':{let c=S.ch.find(q=>q.id==+d.i),a=S.as.find(q=>q.id==c.aid),def=Math.min(a.l,c.o+Math.max(500,Math.round(a.l*.01/500)*500));priceSheet('barg',c.id,def,'Текущее предложение: '+F(c.o));ui.force=0;return}
case'key':{if(ui.pin.length<4)ui.pin+=d.v;if(ui.pin.length==4){if(ui.pin=='1234')ui.unl=1;else{ui.pin='';view();$('#pd').className='pd shk';toast('Неверный код');ui.force=0;return}}break}
case'mom':if(S.mom<S.day){S.mom=S.day;S.cash+=5000;hist('Перевод от мамы',5000);toast('Мама перевела 5 000 ₽')}else toast('Мама уже помогла сегодня');break;
case'loan':{let av=S.trust*8000-S.debt;sheet(`<h3>Кредиты</h3><p>Долг: ${F(S.debt)} · доступно ${F(Math.max(0,av))} · 1% в день</p><div style="display:grid;gap:10px">${[50000,100000,300000].map(x=>`<button class="b1" data-a="take2" data-v="${x}">Взять ${F(x)}</button>`).join('')}<button class="b3" data-a="pay">Погасить долг</button></div>`);ui.force=0;return}
case'take2':{let x=+d.v;if(x>S.trust*8000-S.debt)toast('Лимит доверия исчерпан');else{S.debt+=x;S.cash+=x;hist('Кредит',x);toast('Кредит получен')}sheet();break}
case'pay':{let x=Math.min(S.cash,S.debt);if(x<=0)toast('Нечего погашать');else{S.cash-=x;S.debt-=x;hist('Погашение кредита',-x);if(!S.debt)S.trust=Math.min(100,S.trust+3);toast('Погашено '+F(x))}sheet();break}
case'claim':{let i=+d.i,T=[S.q.b>=2,S.q.sp>=3,S.q.s>=1,S.q.p>=20000];if(T[i]&&!S.q.r[i]){S.q.r[i]=1;S.cash+=5000;hist('Награда за задание',5000)}break}
case'sl':adv(+d.v);ui.force=0;return}
ui.force=0;view();save()}
document.addEventListener('click',e=>{if(e.target.id=='sh'){sheet();return}let t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{if(e.target.id=='q'){ui.q=e.target.value;$('#lst').innerHTML=cards()}});
$('#push').addEventListener('click',()=>{let id=+$('#push').dataset.c;$('#push').className='';if(id){let c=S.ch.find(x=>x.id==id);if(c){c.u=0;nav=[{s:'home'},{s:'chat',id}];view()}}});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.bd,.msgs,.sheet'))e.preventDefault()},{passive:false});
(function(){let c=document.createElement('canvas');c.width=c.height=180;let x=c.getContext('2d');x.fillStyle='#0a84ff';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='800 96px -apple-system,sans-serif';x.textAlign='center';x.fillText('D',90,118);x.fillStyle='#ff9500';x.fillRect(54,132,72,10);$('#ati').href=c.toDataURL()})();
if(S.day<0){S.day=Math.floor(S.t/1440);mkVit()}
setInterval(()=>{step();$('#clk').textContent='День '+(S.day+1)+' · '+tm(S.t)},1000);setInterval(save,5000);
document.addEventListener('visibilitychange',save);view();
</script></body></html>
